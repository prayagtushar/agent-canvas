name: Feature request
description: Something the canvas should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, rather than the feature. It often has a shorter answer than the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you think would fix it
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Optional, but it says a lot about how the current version falls short.
