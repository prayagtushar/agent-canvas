name: Bug report
description: Something in the canvas does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most bugs here turn out to be platform-specific or harness-specific, so
        the three fields below usually decide whether it can be reproduced.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Added a Claude Code agent and an opencode agent
        2. Drew a wire between them
        3. Asked the lead to hand over a task
        The task never appeared on the board.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The title bar shows it, or `git rev-parse --short HEAD` if you run from source.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true

  - type: checkboxes
    id: harnesses
    attributes:
      label: Which CLIs were on the canvas
      options:
        - label: Claude Code
        - label: Codex
        - label: Gemini CLI
        - label: opencode

  - type: textarea
    id: logs
    attributes:
      label: Anything the app said
      description: >
        Diagnostics (the ⓘ button) lists the CLIs it found and how each is wired
        to the Bus. Paste that if the problem is an agent not starting or not
        talking to a peer. Output is formatted as code, so no backticks needed.
      render: shell
