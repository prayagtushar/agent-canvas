name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build

  backend:
    # Both platforms on every push. How a CLI is found and started is the one
    # thing that differs between them, and it is not code you can check by
    # reading it — it either compiles and runs there or it does not.
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
      # tauri::generate_context! needs the frontend bundle to exist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: runner.os == 'macOS'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Windows compiles the tests but does not run them. Every test binary
      # that links Tauri's types dies at load time with
      # STATUS_ENTRYPOINT_NOT_FOUND: some DLL Tauri imports is missing an
      # export the binary was linked against. `tests/worktrees.rs` is the one
      # binary the linker prunes Tauri out of, and it runs there perfectly —
      # so this is about what Tauri drags in, not about anything in this repo.
      # Putting WebView2Loader.dll beside the binaries does not change it.
      #
      # Compiling them is still worth the minutes: it catches test code that
      # does not build on Windows, which is most of what would break. The
      # suite itself runs on macOS.
      - if: runner.os == 'Windows'
        run: cargo build --manifest-path src-tauri/Cargo.toml --tests

      - if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    # Proves the thing users actually download still builds, before a tag
    # makes that everyone's problem. A release-profile build of the whole
    # Tauri stack is the slowest thing here, so it runs on pushes to main and
    # leaves pull request feedback quick.
    if: github.event_name == 'push'
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libsoup-3.0-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle-${{ matrix.os }}
      - run: npm ci
      - run: npm run tauri build -- --no-bundle

      # Starting it, on the one platform nobody here can start it on.
      #
      # Every other job proves the app compiles and bundles, and not one of
      # them ever runs it. Linux shipped a see-through window over whatever
      # the compositor felt like, because the base config sets
      # transparent: true and there is no window effect to ask for there.
      # Reading the config would not have caught that. Looking at it does.
      #
      # This hangs off the bundle job because a release build is the slowest
      # thing in CI and there is no sense paying for a second one. It has to
      # be the release binary either way: a debug build points at devUrl and
      # renders "connection refused" with no dev server behind it, which is
      # how the first version of this check tested nothing at all.
      - name: Start it on a virtual screen
        if: runner.os == 'Linux'
        env:
          # Both are the usual price of webkit2gtk on a machine with no GPU.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          sudo apt-get install -y xvfb imagemagick dbus-x11 openbox xdotool
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 3
          # A real desktop has a window manager, and without one GTK ignores
          # the configured size and maps the window at its natural size. That
          # is worth having here: it is the difference between checking that
          # the app draws and checking that it draws the window it asked for.
          DISPLAY=:99 openbox &
          sleep 2
          DISPLAY=:99 dbus-run-session -- \
            ./src-tauri/target/release/agent-canvas > /tmp/app.log 2>&1 &
          # The first paint is behind a webkit process launch, so give it room.
          sleep 25
          pgrep -f target/release/agent-canvas > /dev/null \
            || { echo "the app exited on startup:"; cat /tmp/app.log; exit 1; }
          DISPLAY=:99 import -window root /tmp/linux-window.png
          # 1440x900 is what tauri.conf.json asks for. Report it rather than
          # asserting: the interesting failure is subtler than a threshold.
          echo "window geometry:"
          DISPLAY=:99 xdotool search --name "Agent Canvas" getwindowgeometry 2>/dev/null || true

      # Windows gets a photograph but no automatic verdict. Mica is the OS
      # blending the desktop into the window, so the result depends on what
      # is behind it, and a brightness threshold would either be meaningless
      # or flap. The picture is uploaded to be looked at.
      - name: Photograph it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath ".\src-tauri\target\release\agent-canvas.exe"
          Start-Sleep -Seconds 25
          if (-not (Get-Process agent-canvas -ErrorAction SilentlyContinue)) {
            throw "the app is not running 25s after launch"
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object Drawing.Bitmap $bounds.Width, $bounds.Height
          $gfx = [Drawing.Graphics]::FromImage($bmp)
          $gfx.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bmp.Size)
          $bmp.Save("$env:RUNNER_TEMP\windows-window.png",
                    [Drawing.Imaging.ImageFormat]::Png)
          Write-Host "captured $($bounds.Width)x$($bounds.Height)"

      - name: Keep the picture (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-window
          path: ${{ runner.temp }}/windows-window.png

      - name: Is that a rendered window?
        if: runner.os == 'Linux'
        run: node .github/scripts/check-render.mjs /tmp/linux-window.png

      - name: Keep the picture either way
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-window
          path: |
            /tmp/linux-window.png
            /tmp/app.log
