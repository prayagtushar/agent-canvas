name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build

  backend:
    # Both platforms on every push. How a CLI is found and started is the one
    # thing that differs between them, and it is not code you can check by
    # reading it — it either compiles and runs there or it does not.
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
      # tauri::generate_context! needs the frontend bundle to exist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Tauri links WebView2Loader.dll through an import library, so every
      # binary that links this crate needs it alongside at load time. The
      # build script puts it there, but a restored build cache skips build
      # scripts — so check, and only fill the gap. `webview2-com-sys` unpacks
      # one copy per architecture, and the wrong one loads no better than none.
      - name: WebView2 loader beside the test binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --tests
          $target = "src-tauri/target/debug/deps/WebView2Loader.dll"
          if (Test-Path $target) {
            Write-Host "already there, left alone"
          } else {
            $source = Get-ChildItem -Path src-tauri/target/debug/build -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1
            if ($source) {
              Copy-Item $source.FullName $target -Force
              Write-Host "copied from $($source.FullName)"
            } else {
              Write-Host "::warning::no x64 WebView2Loader.dll found; the test run may not start"
            }
          }

      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

  bundle:
    # Proves the thing users actually download still builds, before a tag
    # makes that everyone's problem. A release-profile build of the whole
    # Tauri stack is the slowest thing here, so it runs on pushes to main and
    # leaves pull request feedback quick.
    if: github.event_name == 'push'
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle-${{ matrix.os }}
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
