name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build

  backend:
    # Both platforms on every push. How a CLI is found and started is the one
    # thing that differs between them, and it is not code you can check by
    # reading it — it either compiles and runs there or it does not.
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
      # tauri::generate_context! needs the frontend bundle to exist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Tauri links WebView2Loader.dll through an import library, so every
      # binary that links this crate needs it alongside at load time. The
      # build script copies it, but a restored build cache skips build
      # scripts, so this does it again and says what it found.
      - name: WebView2 loader beside the test binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --tests
          $found = Get-ChildItem -Path src-tauri/target/debug -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue
          Write-Host "WebView2Loader.dll copies found: $($found.Count)"
          $found | ForEach-Object { Write-Host "  $($_.FullName)" }
          if ($found.Count -gt 0) {
            Copy-Item $found[0].FullName src-tauri/target/debug/deps/ -Force
            Copy-Item $found[0].FullName src-tauri/target/debug/ -Force
            Write-Host "copied into deps/"
          }
          Write-Host "--- DLLs now beside the test binaries ---"
          Get-ChildItem src-tauri/target/debug/deps -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }

      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

  bundle:
    # Proves the thing users actually download still builds, before a tag
    # makes that everyone's problem. A release-profile build of the whole
    # Tauri stack is the slowest thing here, so it runs on pushes to main and
    # leaves pull request feedback quick.
    if: github.event_name == 'push'
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle-${{ matrix.os }}
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
