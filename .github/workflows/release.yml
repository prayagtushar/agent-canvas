name: Release

# Push a tag to cut a release:
#
#   bun pm version 0.2.0 --no-git-tag-version  # keep package.json and Cargo.toml in step
#   git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# Every platform builds in parallel and uploads into one draft release. Check
# it, then publish by hand — nothing goes out without a person looking first.
#
# Running this by hand from the Actions tab builds the same bundles and leaves
# them as workflow artifacts instead, which is how you check a build without
# cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One download for both Apple architectures. Slower to build than
          # two separate ones, and worth it: nobody should have to know
          # whether their Mac is Intel or Apple silicon.
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - name: Linux (x64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libsoup-3.0-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      # A broken bundle is worse than a late one: the same checks CI runs on
      # every push, run again on the thing that is actually being shipped.
      - run: bun run typecheck
      - run: bun run test:web

      # Signing keys for the in-app updater, read only when
      # `bundle.createUpdaterArtifacts` is on. Leaving that off is the default:
      # with it on and no key, Tauri builds both installers and *then* fails
      # trying to sign, which is a red release with working bundles in it.
      # See "Turning on in-app updates" in the README.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty on a manual run, which tells tauri-action to build without
          # touching releases.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Agent Canvas ${{ github.ref_name }}
          releaseBody: |
            Download the file for your machine below, then see
            [Installing](https://github.com/prayagtushar/agent-canvas#installing).

            These builds are not code-signed, so macOS and Windows will both
            warn you the first time you open the app. The Installing section
            says exactly which warning you will get and how to get past it.
            Linux ships as an AppImage, a .deb and an .rpm.

            Agent Canvas runs the agent CLIs you already have installed. It
            does not ship or download any of them.
          # Add `includeUpdaterJson: true` here when you turn on
          # `bundle.createUpdaterArtifacts`; it publishes the manifest the
          # app checks against.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Manual runs have nowhere to upload to, so keep the bundles here.
      # The installers by extension rather than the whole bundle directory:
      # that directory also holds the AppImage staging tree, which made a
      # Linux artifact 207MB of unpacked libraries nobody wants to download.
      # And not tauri-action's `artifactPaths` — that output is a JSON array,
      # and joining it inside a GitHub expression cannot produce the newline
      # `upload-artifact` needs between paths.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-canvas-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
          if-no-files-found: error
          retention-days: 7
