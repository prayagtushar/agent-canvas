# Three ecosystems, because a Tauri app is three projects in a trench coat:
# the web frontend, the Rust backend, and the workflows that build both.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Tauri JS packages move together and are meaningless apart.
      tauri:
        patterns:
          - "@tauri-apps/*"
      xterm:
        patterns:
          - "@xterm/*"
      # vitest and its coverage provider pin each other exactly, so a bump to
      # one alone cannot install. The first run of this config proved it by
      # opening a coverage-v8 4.x PR against vitest 3.x that failed npm ci.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Same story one layer down: the React plugin requires a matching major
      # of vite itself.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
