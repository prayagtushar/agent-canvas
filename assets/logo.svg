<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b2233"/>
      <stop offset="0.55" stop-color="#111726"/>
      <stop offset="1" stop-color="#080b13"/>
    </linearGradient>
    <linearGradient id="live" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cf08a"/>
      <stop offset="1" stop-color="#1fbf4e"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none"
        stroke="#ffffff" stroke-opacity="0.09" stroke-width="12"/>

  <!-- wires: the canvas is a graph, connections are what make it one -->
  <g stroke="#3d8bfd" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M344 372 H680"/>
    <path d="M344 372 V652"/>
    <path d="M680 372 L344 652" stroke-opacity="0.45"/>
  </g>

  <!-- nodes: square, matching the canvas windows themselves -->
  <g>
    <rect x="252" y="280" width="184" height="184" rx="30" fill="url(#live)"/>
    <rect x="588" y="280" width="184" height="184" rx="30" fill="#0e1420"
          stroke="#8ea6c8" stroke-width="26"/>
    <rect x="252" y="560" width="184" height="184" rx="30" fill="#0e1420"
          stroke="#8ea6c8" stroke-width="26"/>
  </g>
</svg>
