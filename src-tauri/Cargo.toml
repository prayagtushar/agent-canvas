[package]
name = "agent-canvas"
version = "0.1.0"
description = "A supervised canvas for collaborating AI agents"
edition = "2021"

[lib]
name = "agent_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api backs `macOSPrivateApi: true` — required for a
# transparent window that lets the desktop wallpaper show through.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
dirs = "5"
tauri-plugin-dialog = "2.7.2"

[profile.dev]
incremental = true
