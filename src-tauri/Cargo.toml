[package]
name = "agent-canvas"
version = "0.1.0"
description = "A supervised canvas for collaborating AI agents"
edition = "2021"

[lib]
name = "agent_canvas_lib"
# `staticlib` and `cdylib` are what a mobile toolchain links the app as, and
# this is a desktop app. Keeping them made `cargo test` on Windows abort with
# STATUS_ENTRYPOINT_NOT_FOUND before a single test ran: the test harness there
# links the DLL rather than the rlib. Add them back alongside a real iOS or
# Android target, not before.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` backs `macOSPrivateApi: true`, which a transparent
# window needs to let the desktop wallpaper show through. Both the feature and
# the config key stay unconditional: Tauri checks the two against each other
# per target, and a macOS-only config file is not merged into a Windows build,
# so splitting them makes every Windows build fail the check. Windows ignores
# the key itself.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
dirs = "6"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
portable-pty = "0.9.0"
vt100 = "0.16.2"

[profile.dev]
incremental = true
